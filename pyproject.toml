[project]
name = "seas-sip-power-to-influxdb"
version = "1.0.0"
description = "Read-only SAES SIP POWER snapshot relay to InfluxDB"
requires-python = ">=3.11"
dependencies = [
    "influxdb-client>=1.50.0",
    "py-seas-sip-power",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = [".agents"]
pythonpath = ["."]

[tool.ruff.lint]
select = [
    "ANN",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
]

[tool.uv.sources]
py-seas-sip-power = { path = "py-seas-sip-power", editable = true }
